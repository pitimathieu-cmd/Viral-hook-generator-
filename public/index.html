    <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viral Hook Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050b18;
    --bg-grain: #071023;
    --surface: #0d1730;
    --surface-2: #12203f;
    --surface-3: #182a50;
    --border: #24406e;
    --border-soft: #182c4d;
    --text: #eef4ff;
    --text-dim: #9db3d9;
    --text-faint: #5b7099;
    --accent: #2f8fff;
    --accent-2: #7cc9ff;
    --accent-dim: #2f8fff22;
    --accent-glow: #2f8fff55;
    --spark: #eaf6ff;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(47,143,255,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 5%, rgba(255,255,255,0.05), transparent 60%),
      radial-gradient(ellipse 800px 600px at 50% 120%, rgba(47,143,255,0.08), transparent 60%);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection{ background: var(--accent); color: #04101f; }
  button{ font-family: inherit; }

  a, button{ -webkit-tap-highlight-color: transparent; }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    margin-bottom: 56px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 18px var(--accent-glow);
    position: relative;
    flex-shrink:0;
  }
  .brand-mark::after{
    content:"";
    position:absolute; inset:0;
    background: var(--bg);
    clip-path: polygon(38% 22%, 38% 78%, 78% 50%);
  }
  .brand-name{
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .stat-pill{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border-soft);
    padding: 8px 14px;
    border-radius: 100px;
    display:flex;
    align-items:center;
    gap: 8px;
    white-space: nowrap;
  }
  .stat-pill b{
    color: var(--text);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap: 28px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border-soft);
  }
  .tab-btn{
    background:none;
    border:none;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0 0 14px;
    cursor:pointer;
    position: relative;
    display:flex;
    align-items:center;
    gap: 7px;
    transition: color 0.2s ease;
  }
  .tab-btn svg{ width:14px; height:14px; opacity:0.7; }
  .tab-btn:hover{ color: var(--text-dim); }
  .tab-btn.active{ color: var(--text); }
  .tab-btn.active svg{ opacity:1; color: var(--accent-2); }
  .tab-btn.active::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px;
    height:2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius:2px;
  }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; animation: card-in 0.35s ease forwards; }

  /* ---------- Hero / timeline signature ---------- */
  .hero{ margin-bottom: 48px; }
  .timeline{
    position: relative;
    height: 34px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .timeline-ticks{
    display:flex; height:100%;
    justify-content: space-between;
  }
  .timeline-ticks span{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    display:flex; align-items:flex-end; padding-bottom:8px;
  }
  .timeline-window{
    position:absolute; left:0; top:0; bottom:-1px;
    width: 22%;
    background: linear-gradient(90deg, var(--accent-dim), transparent);
    border-right: 1px dashed var(--accent);
  }
  .timeline-window-label{
    position:absolute; top:-2px; left:0;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transform: translateY(-100%);
    padding-bottom: 6px;
    white-space: nowrap;
  }

  h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(32px, 5.4vw, 54px);
    line-height: 1.06;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }
  h1 em{
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
  }
  .hero p{
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-dim);
    max-width: 520px;
    margin: 0;
  }

  .hero-row{
    display:flex;
    align-items:center;
    gap: 40px;
    justify-content: space-between;
  }
  .hero-copy{ flex: 1 1 460px; min-width: 0; }
  .hero-art{
    flex: 0 0 220px;
    width: 220px;
    height: 220px;
    position: relative;
  }
  .hero-art svg{ width:100%; height:100%; }
  .hero-art-glow{
    position:absolute; inset: -30px;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    filter: blur(6px);
    z-index: -1;
  }

  /* ---------- Partners / logos grid ---------- */
  .partners{
    margin-top: 40px;
  }
  .partners-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 14px;
  }
  .partners-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .partner-card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px;
    display:flex;
    align-items:center;
    gap: 12px;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .partner-card:hover{
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 16px 30px -18px var(--accent-glow);
  }
  .partner-badge{
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .partner-badge svg{ width: 20px; height:20px; color: var(--accent-2); }
  .partner-text{ min-width:0; }
  .partner-name{
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .partner-role{
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  @media (max-width: 720px){
    .hero-row{ flex-direction: column; align-items: flex-start; gap: 24px; }
    .hero-art{ width: 140px; height: 140px; flex-basis: 140px; align-self: center; }
  }

  /* ---------- Console (form) ---------- */
  .console{
    background: linear-gradient(180deg, var(--surface), var(--bg-grain));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-top: 40px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);
  }
  .field-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 12px;
    display:block;
  }
  .field-group{ margin-bottom: 26px; }
  .field-group:last-of-type{ margin-bottom: 0; }

  .pill-row{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .pill{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    user-select: none;
  }
  .pill svg{ width:15px; height:15px; opacity:0.75; flex-shrink:0; }
  .pill:hover{ border-color: #3a3a4a; color: var(--text); transform: translateY(-1px); }
  .pill.active{
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text);
  }
  .pill.active svg{ opacity:1; }

  input[type="text"]{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: var(--font-body);
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  input[type="text"]::placeholder{ color: var(--text-faint); }
  input[type="text"]:focus{ border-color: var(--accent); background: var(--surface-3); }
  input[type="text"]:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  textarea{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: var(--font-display);
    font-style: italic;
    resize: vertical;
    min-height: 76px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  textarea::placeholder{ color: var(--text-faint); font-family: var(--font-body); font-style: normal; }
  textarea:focus{ border-color: var(--accent); background: var(--surface-3); }
  textarea:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .generate-row{
    display:flex;
    align-items:center;
    gap: 16px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .btn-generate{
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #04101f;
    border: none;
    padding: 15px 26px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap: 10px;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    box-shadow: 0 12px 30px -10px var(--accent-glow);
  }
  .btn-generate:hover{ transform: translateY(-2px); box-shadow: 0 16px 36px -8px var(--accent-glow); }
  .btn-generate:active{ transform: translateY(0px); }
  .btn-generate:disabled{ opacity: 0.55; cursor: not-allowed; transform:none; box-shadow:none; }
  .btn-generate:focus-visible{ outline: 2px solid var(--text); outline-offset: 3px; }
  .btn-generate svg{ width:17px; height:17px; }

  .generate-hint{
    font-size: 12.5px;
    color: var(--text-faint);
  }
  .error-msg{
    font-size: 13px;
    color: var(--accent);
    margin-top: 14px;
    display:none;
  }
  .error-msg.show{ display:block; }

  /* ---------- Loading ---------- */
  .loading-row{
    display:none;
    align-items:center;
    gap: 12px;
    margin-top: 30px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .loading-row.show{ display:flex; }
  .spinner{
    width: 15px; height:15px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- Results ---------- */
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin: 56px 0 20px;
    gap: 12px;
  }
  .section-title{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin:0;
  }
  .section-sub{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .results-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .hook-card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 22px;
    position: relative;
    display:flex;
    flex-direction: column;
    gap: 16px;
    opacity: 0;
    transform: translateY(14px);
    animation: card-in 0.5s ease forwards;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }
  .hook-card:hover{
    border-color: #37374a;
    box-shadow: 0 20px 40px -22px rgba(0,0,0,0.7);
    transform: translateY(-3px);
  }
  @keyframes card-in{
    to{ opacity:1; transform: translateY(0); }
  }

  .card-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  .card-index{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
  }
  .punch-meter{
    display:flex; align-items:center; gap:7px;
  }
  .punch-bars{ display:flex; gap:3px; align-items:flex-end; height:14px; }
  .punch-bars span{
    width:3px; border-radius:2px;
    background: var(--border);
    display:block;
  }
  .punch-bars span.lit{ background: var(--spark); }
  .punch-bars span:nth-child(1){ height:5px; }
  .punch-bars span:nth-child(2){ height:8px; }
  .punch-bars span:nth-child(3){ height:11px; }
  .punch-bars span:nth-child(4){ height:14px; }
  .punch-score{
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }

  .hook-text{
    font-family: var(--font-display);
    font-size: 17.5px;
    line-height: 1.45;
    font-weight: 500;
    color: var(--text);
    flex-grow: 1;
  }

  .card-bottom{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 4px;
    border-top: 1px solid var(--border-soft);
  }
  .tag-row{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .tag{
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    padding: 4px 8px;
    border: 1px solid var(--border-soft);
    border-radius: 6px;
  }
  .card-actions{ display:flex; gap:8px; }
  .icon-btn{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 34px; height:34px;
    border-radius: 9px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn:hover{ color: var(--text); border-color: #3a3a4a; transform: translateY(-1px); }
  .icon-btn.copied{ background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  .icon-btn.copy-failed{ background: #ff3d3d22; border-color: #ff3d3d; color: #ffb3b3; }
  .icon-btn.saved{ background: var(--spark); border-color: var(--spark); color: #04101f; }
  .icon-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Saved section ---------- */
  .saved-list{ display:flex; flex-direction: column; gap: 10px; }
  .saved-item{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px 16px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 14px;
  }
  .saved-item-text{
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
  }
  .saved-item-meta{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-top: 4px;
    letter-spacing: 0.05em;
  }
  .empty-state{
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 30px 20px;
    text-align:center;
    color: var(--text-faint);
    font-size: 13.5px;
  }
  .empty-state span{ display:block; font-family: var(--font-display); font-size: 16px; color: var(--text-dim); margin-bottom: 6px; font-style: italic; }
  .empty-state-icon{
    width: 40px; height: 40px;
    margin: 0 auto 14px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .empty-state-icon svg{ width:19px; height:19px; color: var(--accent-2); }

  /* ---------- Hero illustration (happy person + phone) ---------- */
  .hero-art{ background: transparent; }
  .hero-art svg{ display:block; }

  /* ---------- Script tab ---------- */
  .script-textarea-wrap{ position: relative; }
  .hook-source-row{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .hook-source-chip{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    padding: 5px 10px;
    border-radius: 100px;
  }
  .beat-list{ display:flex; flex-direction: column; gap: 14px; }
  .beat-card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 20px 22px;
    display:flex;
    gap: 18px;
    opacity:0;
    transform: translateY(10px);
    animation: card-in 0.45s ease forwards;
  }
  .beat-marker{
    flex-shrink:0;
    width: 40px;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 6px;
  }
  .beat-dot{
    width: 10px; height:10px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .beat-line{ flex-grow:1; width:1px; background: var(--border); }
  .beat-body{ flex-grow:1; min-width:0; }
  .beat-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .beat-label{
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--accent-2);
  }
  .beat-time{
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }
  .beat-text{
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
  }
  .script-summary-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
  }
  .btn-secondary{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 18px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap: 8px;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .btn-secondary:hover{ border-color: var(--accent); transform: translateY(-1px); }
  .btn-secondary svg{ width:14px; height:14px; }
  .btn-secondary.copied{ border-color: var(--accent); color: var(--accent-2); }
  .btn-secondary.copy-failed{ border-color: #ff3d3d; color: #ffb3b3; }

  /* ---------- Pricing ---------- */
  .pricing-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
  }
  .price-card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 28px 24px;
    display:flex;
